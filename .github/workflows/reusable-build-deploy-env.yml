name: Reusable Build Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: qa, staging, or prod"
        required: true
        type: string
      base_sha:
        description: "Base commit for change detection"
        required: false
        default: ""
        type: string
      head_sha:
        description: "Head commit for change detection"
        required: false
        default: ""
        type: string

jobs:
  notify-start:
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: start
      environment: ${{ inputs.environment }}
    secrets: inherit

  detect:
    needs: notify-start
    uses: ./.github/workflows/reusable-detect.yml
    with:
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}

  build:
    environment: ${{ inputs.environment }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix).include }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Read service version - ${{ matrix.name }}
        id: version
        shell: bash
        run: |
          set -euo pipefail

          PKG_FILE="${{ matrix.package_file }}"

          if [ ! -f "$PKG_FILE" ]; then
            echo "::error::Missing package.json for ${{ matrix.name }} at $PKG_FILE"
            exit 1
          fi

          VERSION="$(jq -r '.version' "$PKG_FILE")"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version for ${{ matrix.name }} in $PKG_FILE: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Service ${{ matrix.name }} version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push ${{ inputs.environment }} image - ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.docker_context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.environment }}/${{ matrix.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.environment }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ inputs.environment }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}-${{ matrix.name }}

  deploy:
    environment: ${{ inputs.environment }}
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix).include }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Read service version - ${{ matrix.name }}
        id: version
        shell: bash
        run: |
          set -euo pipefail

          PKG_FILE="${{ matrix.package_file }}"

          if [ ! -f "$PKG_FILE" ]; then
            echo "::error::Missing package.json for ${{ matrix.name }} at $PKG_FILE"
            exit 1
          fi

          VERSION="$(jq -r '.version' "$PKG_FILE")"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version for ${{ matrix.name }} in $PKG_FILE: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Service ${{ matrix.name }} version: $VERSION"

      - name: Deploy ${{ matrix.name }} via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[matrix.ssh_host_secret] }}
          username: ${{ secrets[matrix.ssh_user_secret] }}
          key: ${{ secrets[matrix.ssh_key_secret] }}
          script: bash /var/www/deploy-script-200m.sh ${{ matrix.name }} ${{ steps.version.outputs.version }} ${{ inputs.environment }}

  notify-success:
    needs: [detect, build, deploy]
    if: always() && needs.detect.outputs.has_changes == 'true' && needs.build.result == 'success' && needs.deploy.result == 'success'
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: success
      environment: ${{ inputs.environment }}
    secrets: inherit

  notify-failed:
    needs: [detect, build, deploy]
    if: always() && (needs.detect.result == 'failure' || (needs.detect.outputs.has_changes == 'true' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')))
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: failed
      environment: ${{ inputs.environment }}
    secrets: inherit

  notify-no-changes:
    needs: detect
    if: always() && needs.detect.outputs.has_changes == 'false'
    uses: ./.github/workflows/reusable-notify.yml
    with:
      status: skipped
      environment: ${{ inputs.environment }}
    secrets: inherit
