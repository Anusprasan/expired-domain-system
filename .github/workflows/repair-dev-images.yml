name: Repair Dev Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from"
        required: true
        default: "dev"
        type: string
      services:
        description: "Comma-separated service names, or all"
        required: true
        default: "all"
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      has_services: ${{ steps.prepare.outputs.has_services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - id: prepare
        name: Build repair matrix
        shell: bash
        run: |
          set -euo pipefail

          CATALOG=".github/service-catalog.json"
          REQUESTED="$(echo "${{ inputs.services }}" | tr -d '[:space:]')"

          if [ -z "$REQUESTED" ]; then
            REQUESTED="all"
          fi

          service_requested() {
            local name="$1"

            if [ "$REQUESTED" = "all" ]; then
              return 0
            fi

            IFS=',' read -ra ITEMS <<< "$REQUESTED"
            for item in "${ITEMS[@]}"; do
              if [ "$item" = "$name" ]; then
                return 0
              fi
            done

            return 1
          }

          MATRIX='{"include":[]}'
          mapfile -t SERVICES < <(jq -c '.services[]' "$CATALOG")

          for service_json in "${SERVICES[@]}"; do
            NAME="$(echo "$service_json" | jq -r '.name')"
            if service_requested "$NAME"; then
              MATRIX="$(echo "$MATRIX" | jq --argjson service "$service_json" '.include += [$service]')"
              echo "Selected service: $NAME"
            fi
          done

          if [ "$REQUESTED" != "all" ]; then
            IFS=',' read -ra ITEMS <<< "$REQUESTED"
            for item in "${ITEMS[@]}"; do
              [ -z "$item" ] && continue
              if ! jq -e --arg name "$item" '.services[] | select(.name == $name)' "$CATALOG" >/dev/null; then
                echo "::error::Unknown service '$item'. Check .github/service-catalog.json for valid names."
                exit 1
              fi
            done
          fi

          COUNT="$(echo "$MATRIX" | jq '.include | length')"
          HAS_SERVICES="false"
          if [ "$COUNT" -gt 0 ]; then
            HAS_SERVICES="true"
          fi

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "has_services=$HAS_SERVICES" >> "$GITHUB_OUTPUT"

  repair:
    needs: prepare
    if: needs.prepare.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix).include }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Read service version - ${{ matrix.name }}
        id: version
        shell: bash
        run: |
          set -euo pipefail

          PKG_FILE="${{ matrix.package_file }}"

          if [ ! -f "$PKG_FILE" ]; then
            echo "::error::Missing package.json for ${{ matrix.name }} at $PKG_FILE"
            exit 1
          fi

          VERSION="$(jq -r '.version' "$PKG_FILE")"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version for ${{ matrix.name }} in $PKG_FILE: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Service ${{ matrix.name }} version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push repaired dev image - ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.docker_context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev/${{ matrix.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/dev/${{ matrix.name }}:latest
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.name }}
